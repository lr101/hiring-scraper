{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Job Monitor{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'app.css' %}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{% url 'jobs:feed' %}">Job Monitor</a>
      <nav aria-label="Main navigation">
        <a href="{% url 'jobs:feed' %}">Feed</a>
        <a href="{% url 'jobs:search' %}">Search</a>
        <a href="{% url 'jobs:profile' %}">Profile</a>
      </nav>
      <form class="account-picker" method="post" action="{% url 'jobs:select_user' %}">
        {% csrf_token %}
        <label for="workspace-user">Account</label>
        <select id="workspace-user" name="user" onchange="this.form.submit()">
          {% for user in workspace_users %}
            <option value="{{ user.pk }}"{% if user == active_user %} selected{% endif %}>{{ user.name }}</option>
          {% empty %}
            <option disabled>No accounts</option>
          {% endfor %}
        </select>
      </form>
    </header>
    <main class="page-shell">
      {% if messages %}
        {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
