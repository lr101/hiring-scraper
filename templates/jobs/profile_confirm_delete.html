{% extends "base.html" %}

{% block title %}Delete job profile | Job Monitor{% endblock %}

{% block content %}
  <section class="card confirm-card">
    <h1>Delete {{ profile.name }}?</h1>
    <p>This removes the profile and its matches. Collected jobs stay in the monitor.</p>
    <form method="post">{% csrf_token %}<button type="submit">Delete profile</button> <a class="text-link" href="{% url 'jobs:profile_list' %}">Cancel</a></form>
  </section>
{% endblock %}
