[project]
name = "hiring-scraper"
version = "0.2.0"
description = "German employer and job discovery"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.17,<2",
  "fastapi>=0.128,<1",
  "huggingface-hub>=0.34,<3",
  "lxml>=6,<7",
  "numpy>=2.2,<3",
  "onnxruntime>=1.22,<2",
  "pgvector>=0.4,<1",
  "playwright>=1.55,<2",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=6.21,<7",
  "sqlalchemy>=2.0,<3",
  "tokenizers>=0.21,<1",
  "uvicorn[standard]>=0.40,<1",
]

[project.scripts]
hiring-seed = "hiring_scraper.app.seed:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hiring_scraper*"]

[tool.setuptools.package-data]
"hiring_scraper.app" = ["*.json", "*.txt"]
hiring_scraper = ["elections/*.csv"]

[tool.uv]
package = true
