[project]
name = "hiring-scraper"
version = "0.1.0"
description = "Private job monitor for German company career sites"
requires-python = ">=3.13"
dependencies = [
  "celery[redis]>=5.5,<5.6",
  "django>=5.2,<5.3",
  "gunicorn>=23,<24",
  "httpx>=0.28,<0.29",
  "psycopg[binary]>=3.2,<3.3",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
  "django-stubs>=5.2,<5.3",
  "mypy>=1.17,<1.18",
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "respx>=0.22,<0.23",
  "ruff>=0.12,<0.13",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.13"
strict = true
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings"

