[project]
name = "hiring-scraper"
version = "0.2.0"
description = "German employer and job discovery"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.17,<2",
  "fastapi>=0.128,<1",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.40,<1",
]

[project.scripts]
hiring-seed = "hiring_scraper.app.seed:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hiring_scraper*"]

[tool.uv]
package = true
