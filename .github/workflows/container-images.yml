name: Container CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Container checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: container-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit merged into main." >&2
            exit 1
          fi
          python3 scripts/ci/release_notes.py --tag "$RELEASE_TAG"

      - name: Test, build, and smoke test in Docker
        env:
          HIRING_CI_LOAD_CHROMIUM_PROFILE: "1"
          HIRING_CI_WAIT_TIMEOUT: "120"
        run: ./scripts/ci/run.sh

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-results/*.log
            .ci-results/*.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  extension:
    name: Radius extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: extension-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            extensions/application-companion/package-lock.json

      - name: Set up locked Python environment
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.23'
          enable-cache: true

      - name: Install dependencies and full Chromium
        run: |
          uv sync --locked
          npm --prefix extensions/application-companion ci
          npm --prefix frontend ci
          uv run python -m playwright install --with-deps chromium

      - name: Install PDF export runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation texlive-luatex texlive-latex-recommended
          libreoffice --version
          lualatex --version

      - name: Check extension and build production frontend
        run: |
          npm --prefix extensions/application-companion run check
          npm --prefix extensions/application-companion test
          node tests/frontend_application_preparation.mjs
          node tests/frontend_application_handoff.mjs
          node tests/frontend_application_form.mjs
          npm --prefix frontend run build

      - name: Test shipped extension and production CV flow in Chromium
        env:
          RADIUS_EXTENSION_BROWSER_TESTS: '1'
        run: uv run python -m unittest discover -s tests/application_companion -t tests -v

      - name: Build installable ZIP and checksum
        run: uv run python scripts/build_extension.py

      - name: Upload installable Chrome package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radius-application-companion
          path: dist/extension/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish container images
    needs: [checks, extension]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: container-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize image repository
        id: repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.repository.outputs.name }}/hiring-scraper
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Generate database image tags and labels
        id: db-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.repository.outputs.name }}/hiring-scraper
          flavor: latest=false
          tags: |
            type=raw,value=db-${{ github.sha }}
            type=raw,value=db-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag,prefix=db-
            type=semver,pattern={{version}},prefix=db-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=hiring-scraper-app
          cache-to: type=gha,mode=max,scope=hiring-scraper-app

      - name: Build and publish PostgreSQL/PostGIS with pgvector
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.postgres
          push: true
          platforms: linux/amd64
          tags: ${{ steps.db-metadata.outputs.tags }}
          labels: ${{ steps.db-metadata.outputs.labels }}
          cache-from: type=gha,scope=hiring-scraper-db
          cache-to: type=gha,mode=max,scope=hiring-scraper-db

  release:
    name: Create GitHub Release
    needs: [checks, extension, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download tested Chrome package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: radius-application-companion
          path: dist/extension

      - name: Extract curated release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/ci/release_notes.py --tag "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Create release unless already published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$is_draft" == "true" ]]; then
              echo "A draft exists for $RELEASE_TAG. Resolve it in GitHub before retrying." >&2
              exit 1
            fi
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "Radius $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Attach tested Chrome package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist/extension/radius-application-companion.zip dist/extension/radius-application-companion.zip.sha256 --clobber
