name: Container CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Container checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: container-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit merged into main." >&2
            exit 1
          fi
          python3 scripts/ci/release_notes.py --tag "$RELEASE_TAG"

      - name: Test, build, and smoke test in Docker
        run: ./scripts/ci/run.sh

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-results/*.log
            .ci-results/*.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish application image
    needs: checks
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: container-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalize image repository
        id: repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.repository.outputs.name }}/hiring-scraper
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=hiring-scraper-app
          cache-to: type=gha,mode=max,scope=hiring-scraper-app

  release:
    name: Create GitHub Release
    needs: [checks, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: github-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract curated release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/ci/release_notes.py --tag "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Create release unless already published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$is_draft" == "true" ]]; then
              echo "A draft exists for $RELEASE_TAG. Resolve it in GitHub before retrying." >&2
              exit 1
            fi
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "Radius $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
