services:
  db:
    image: ${HIRING_DB_IMAGE:-ghcr.io/lr101/hiring-scraper/hiring-scraper:db-latest}
    environment:
      POSTGRES_DB: hiring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    restart: unless-stopped
    volumes:
      - hiring_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d hiring"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    image: ${HIRING_APP_IMAGE:-ghcr.io/lr101/hiring-scraper/hiring-scraper:latest}
    volumes:
      - ${HIRING_DOTENV_FILE:-./.env}:/run/app-bootstrap.env:ro
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8000"
    environment:
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-HiringScraper/0.2}
      HIRING_USER_AGENT: ${HIRING_USER_AGENT:-HiringScraper/0.2 (public job discovery)}
      FEED_SCAN_INTERVAL_HOURS: ${FEED_SCAN_INTERVAL_HOURS:-6}
      SCAN_POLL_SECONDS: ${SCAN_POLL_SECONDS:-3}
      SEARCH_SNAPSHOT_POLL_SECONDS: ${SEARCH_SNAPSHOT_POLL_SECONDS:-1}
      SEARCH_SNAPSHOT_PREWARM_SECONDS: ${SEARCH_SNAPSHOT_PREWARM_SECONDS:-60}
      APPLICATION_WEEKLY_GOAL: ${APPLICATION_WEEKLY_GOAL:-10}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-10}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-120000}
      DB_IDLE_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_TRANSACTION_TIMEOUT_MS:-120000}
      SEMANTIC_EMBEDDING_THREADS: ${SEMANTIC_EMBEDDING_THREADS:-2}
      SEMANTIC_INDEX_BATCH_SIZE: ${SEMANTIC_INDEX_BATCH_SIZE:-32}
      SEMANTIC_INDEX_POLL_SECONDS: ${SEMANTIC_INDEX_POLL_SECONDS:-2}
      CRAWL_DELAY_SECONDS: ${CRAWL_DELAY_SECONDS:-1}
      CAREER_DISCOVERY_INTERVAL_DAYS: ${CAREER_DISCOVERY_INTERVAL_DAYS:-30}
      CAREER_DISCOVERY_POLL_SECONDS: ${CAREER_DISCOVERY_POLL_SECONDS:-3}
      CAREER_DISCOVERY_BATCH_DELAY_SECONDS: ${CAREER_DISCOVERY_BATCH_DELAY_SECONDS:-1}
      CAREER_DISCOVERY_DELAY_SECONDS: ${CAREER_DISCOVERY_DELAY_SECONDS:-1}
      CAREER_DISCOVERY_WORKERS: ${CAREER_DISCOVERY_WORKERS:-8}
      CAREER_DISCOVERY_MAX_PAGES: ${CAREER_DISCOVERY_MAX_PAGES:-12}
      CAREER_DISCOVERY_MAX_DEPTH: ${CAREER_DISCOVERY_MAX_DEPTH:-3}
      CAREER_DISCOVERY_MAX_REQUESTS: ${CAREER_DISCOVERY_MAX_REQUESTS:-48}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      HOMEPAGE_DISCOVERY_MAX_COMPANIES: ${HOMEPAGE_DISCOVERY_MAX_COMPANIES:-100}
      HOMEPAGE_DISCOVERY_MAX_SEARCHES: ${HOMEPAGE_DISCOVERY_MAX_SEARCHES:-50}
      HOMEPAGE_DISCOVERY_MAX_REQUESTS: ${HOMEPAGE_DISCOVERY_MAX_REQUESTS:-180}
      RUN_BACKGROUND_WORKERS: ${RUN_BACKGROUND_WORKERS:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # The custom profiles allow Chromium's user-namespace sandbox while
    # retaining Docker's seccomp allowlist for all other syscalls.
    security_opt:
      - apparmor=${HIRING_APPARMOR_PROFILE:-unconfined}
      - seccomp=${PWD}/docker/chromium-seccomp.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  hiring_db:
