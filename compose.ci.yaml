# Run through scripts/ci/run.sh: a unique project and fresh credentials isolate CI.
services:
  quality:
    image: ${HIRING_QUALITY_IMAGE:-hiring-scraper-checks:dev}
    build:
      context: .
      dockerfile: Dockerfile.ci
    environment:
      DATABASE_URL: sqlite:////tmp/hiring-checks.sqlite3
    network_mode: none
    init: true

  smoke:
    image: ${HIRING_QUALITY_IMAGE:-hiring-scraper-checks:dev}
    command: ["python", "scripts/ci/smoke.py"]
    volumes:
      - ${HIRING_DOTENV_FILE:-./.env}:/run/app-bootstrap.env:ro
    depends_on:
      app:
        condition: service_healthy
    init: true

  app:
    image: ${HIRING_APP_IMAGE:-hiring-scraper:ci}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RUN_BACKGROUND_WORKERS: "false"
