# Run through scripts/ci/run.sh: a unique project and fresh credentials isolate CI.
services:
  db:
    image: ${HIRING_DB_IMAGE:-hiring-scraper-postgis-pgvector:ci}
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres
    networks: [default, checks]

  quality:
    image: ${HIRING_QUALITY_IMAGE:-hiring-scraper-checks:dev}
    build:
      context: .
      dockerfile: Dockerfile.ci
    environment:
      # A separate disposable database on the stack's PostgreSQL/PostGIS/pgvector image.
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/hiring_test
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/hiring_test
    depends_on:
      db:
        condition: service_healthy
    # Internal network: the database is reachable, the internet is not.
    networks: [checks]
    init: true

  smoke:
    image: ${HIRING_QUALITY_IMAGE:-hiring-scraper-checks:dev}
    command: ["python", "scripts/ci/smoke.py"]
    volumes:
      - ${HIRING_DOTENV_FILE:-./.env}:/run/app-bootstrap.env:ro
    depends_on:
      app:
        condition: service_healthy
    init: true

  codex-state-smoke:
    image: ${HIRING_APP_IMAGE:-hiring-scraper:ci}
    entrypoint: ["python", "/run/codex-state-smoke.py"]
    volumes:
      - ./scripts/ci/codex_state_smoke.py:/run/codex-state-smoke.py:ro
    network_mode: none
    init: true

  browser-sandbox-smoke:
    image: ${HIRING_APP_IMAGE:-hiring-scraper:ci}
    entrypoint: ["python", "/usr/local/bin/hiring-browser-sandbox-smoke.py"]
    user: "10001:10001"
    network_mode: none
    security_opt:
      - apparmor=${HIRING_APPARMOR_PROFILE:-unconfined}
      - seccomp=${PWD}/docker/chromium-seccomp.json
    init: true

  app:
    image: ${HIRING_APP_IMAGE:-hiring-scraper:ci}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RUN_BACKGROUND_WORKERS: "false"

networks:
  checks:
    internal: true
